name: Sync to Hugging Face Hub

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'src/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
        contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync to Hugging Face Hub
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          
          huggingface_repo_id: alsubari/dytr
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: model
          private: false
